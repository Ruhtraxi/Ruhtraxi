<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Ruhtraxi — Programador na Mileto Apps</title>
  <desc id="desc">Banner tech-noir com o nome Ruhtraxi e a frase building useful systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="65%">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#0891b2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.20"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="318" rx="27" fill="none" stroke="#334155" stroke-opacity="0.7"/>

  <circle cx="1135" cy="56" r="176" fill="none" stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="1135" cy="56" r="126" fill="none" stroke="#22d3ee" stroke-opacity="0.14" stroke-width="1"/>
  <path d="M938 0 L1280 0 L1280 206 Z" fill="#312e81" fill-opacity="0.08"/>
  <path d="M0 266 H1280" stroke="url(#accent)" stroke-opacity="0.35"/>

  <g transform="translate(72 46)">
    <rect width="286" height="32" rx="16" fill="#0f172a" stroke="#312e81"/>
    <circle cx="17" cy="16" r="4" fill="#22d3ee"/>
    <text x="32" y="21" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">// SOFTWARE · SYSTEMS · AI</text>
  </g>

  <text x="72" y="168" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" letter-spacing="8">RUHTRAXI</text>
  <rect x="72" y="191" width="6" height="30" rx="3" fill="url(#accent)"/>
  <text x="96" y="213" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">PROGRAMADOR · MILETO APPS</text>

  <g transform="translate(820 225)">
    <rect width="390" height="50" rx="12" fill="#08111f" stroke="#164e63" stroke-opacity="0.9"/>
    <circle cx="18" cy="25" r="4" fill="#8b5cf6"/>
    <text x="32" y="31" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">&gt; building useful systems_</text>
  </g>

  <text x="72" y="291" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4">CODE CLEAR · SYSTEMS USEFUL · EVOLUTION CONSTANT</text>
</svg>
